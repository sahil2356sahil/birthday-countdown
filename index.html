<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 90%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            min-width: 100px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .time-unit:hover {
            transform: scale(1.05);
        }

        .number {
            display: block;
            font-size: 3rem;
            font-weight: bold;
            color: white;
        }

        .label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .surprise-btn {
            display: none;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff6b6b 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            animation: gradientShift 2s ease infinite;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }

        .surprise-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .surprise-btn.show {
            display: inline-block;
            animation: popIn 0.5s ease-out;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes popIn {
            0% { 
                transform: scale(0); 
                opacity: 0;
            }
            70% {
                transform: scale(1.2);
            }
            100% { 
                transform: scale(1); 
                opacity: 1;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Floating hearts animation */
        .heart {
            position: fixed;
            color: #ff6b6b;
            font-size: 2rem;
            animation: floatUp ease-in-out infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            .time-unit {
                min-width: 70px;
                padding: 1rem;
            }
            .number {
                font-size: 2rem;
            }
            .label {
                font-size: 0.7rem;
            }
            .countdown {
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 Birthday Countdown 🎂</h1>
        <p class="subtitle">Counting down to March 11th!</p>
        
        <div class="countdown" id="countdown">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <a href="https://sahil2356sahil.github.io/trial-site/" class="surprise-btn" id="surpriseBtn">
            🎉 Surprise! Click Me! 🎉
        </a>
    </div>

    <script>
        // Target birthday: March 11th
        const birthdayMonth = 2; // March (0-indexed: 0 = January, 2 = March)
        const birthdayDate = 11;
        const redirectUrl = "https://sahil2356sahil.github.io/trial-site/";

        function getNextBirthday() {
            const now = new Date();
            let year = now.getFullYear();
            let birthday = new Date(year, birthdayMonth, birthdayDate);

            // If birthday has passed this year, get next year's birthday
            if (now > birthday) {
                birthday = new Date(year + 1, birthdayMonth, birthdayDate);
            }

            return birthday;
        }

        function updateCountdown() {
            const now = new Date();
            const birthday = getNextBirthday();
            const diff = birthday - now;

            if (diff <= 0) {
                // It's birthday time!
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                
                showSurprise();
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // Check if it's March 11th to show surprise button
            checkBirthday(now);
        }

        function checkBirthday(now) {
            // Check if today is March 11th
            if (now.getMonth() === birthdayMonth && now.getDate() === birthdayDate) {
                showSurprise();
            }
        }

        function showSurprise() {
            const surpriseBtn = document.getElementById('surpriseBtn');
            const countdown = document.getElementById('countdown');
            
            if (!surpriseBtn.classList.contains('show')) {
                surpriseBtn.classList.add('show');
                countdown.style.display = 'none';
                createConfetti();
                createHearts();
            }
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);

                    // Remove after animation
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }

        function createHearts() {
            const hearts = ['❤️', '💖', '💗', '💕', '💝', '💘'];
            
            for (let i = 0; i < 20; i++) {
                setInterval(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 7000);
                }, 1000 + i * 500);
            }
        }

        // Initial call
        updateCountdown();
        
        // Update every second
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
